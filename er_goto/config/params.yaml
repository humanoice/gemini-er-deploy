# er_goto tunables. target, dry_run and save_debug_images come from the launch file.
# Keep floats written with a decimal point: ROS rejects an int for a float parameter.

er_goto:
  ros__parameters:
    # Gemini
    model: "gemini-robotics-er-2-preview"
    thinking_level: "low"        # latency vs accuracy; "" leaves it to the model default
    gemini_timeout: 15.0         # s per request
    gemini_retries: 1            # extra attempts on timeout / server error / 429
    max_api_errors: 3            # consecutive failed LOOKs before giving up

    # Look-while-walking loop
    stop_dist: 0.8               # m, walk until this far in front of the target
    arrive_tol: 0.1              # m, a standing LOOK within stop_dist + this counts as arrived
    align_tol: 0.15              # rad (~9 deg), arrived only when aligned within this
    turn_in_place_angle: 0.5     # rad (~29 deg), turn in place above this, else turn while walking
    k_turn: 1.5                  # 1/s, angular.z = k_turn * bearing, capped at turn_speed
    turn_speed: 0.5              # rad/s, fastest turn, also the SEARCH rotation
    walk_speed: 0.35             # m/s, fastest walk
    min_walk_speed: 0.15         # m/s, slowest walk, so the gait still steps forward
    slow_dist: 0.5               # m, slow down over this last stretch before stop_dist
    settle_time: 0.3             # s standing still before a standing LOOK
    search_turn_time: 1.5        # s per SEARCH rotation (~43 deg at 0.5 rad/s)
    max_search: 10               # standing LOOKs in a row without the target before giving up
    min_progress: 0.3            # a standing LOOK must show the robot this fraction of its dead-reckoned walk closer
    max_stalls: 2                # standing LOOKs in a row showing less before giving up; 0 = off (always off in a dry run)
    max_iterations: 40           # hard cap on Gemini LOOKs
    camera_yaw_offset: 0.0       # rad, camera mounting yaw (+ = camera turned left)
    depth_patch_radius: 5        # px, median depth patch around the Gemini point

    # Safety
    max_linear_x: 0.5            # m/s, node clamp; default policy allows up to 0.6
    max_angular_z: 0.6           # rad/s, node clamp; default policy allows up to 0.8
    publish_rate: 20.0           # Hz, control loop
    max_blind_time: 10.0         # s, stand and look again if the newest fix's photo is older
    max_blind_dist: 2.5          # m, stand and look again after walking this far on one fix
    max_run_time: 300.0          # s, total run time limit
    max_frame_age: 0.5           # s, no walking if depth or RGB is older
    watchdog_timeout: 0.5        # s without a command from the control loop -> zero
    obstacle_dist: 0.5           # m, stop walking if anything is closer in the corridor
    obstacle_min_depth: 0.1      # m, ignore depth readings below this
